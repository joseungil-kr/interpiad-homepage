name: Free form browser and PDF checks

on:
  push:
    branches: [master, 'feat/interpiad-free-forms-*']
    paths:
      - 'content/tools/**'
      - 'layouts/tools/**'
      - 'layouts/shortcodes/form-*'
      - 'static/tools/**'
      - 'tests/forms-*'
      - 'tests/indexnow-response.cjs'
      - 'scripts/indexnow-submit.js'
      - '.github/workflows/forms-check.yml'
      - 'hugo.toml'
  workflow_dispatch:

jobs:
  forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and static DOM tests
        run: |
          hugo --minify
          npm install --prefix /tmp/form-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          node tests/indexnow-response.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0 pypdf==6.1.3 pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify browser, PDF and mobile output
        run: |
          python -m http.server 8765 --directory public >/tmp/forms-server.log 2>&1 &
          for attempt in $(seq 1 15); do curl -fsS http://127.0.0.1:8765/tools/ >/dev/null && break; sleep 1; done
          FORM_GENERATE_PREVIEWS=1 python tests/forms-documents.py
          hugo --minify
          NODE_PATH=/tmp/form-tests/node_modules node tests/forms-dom.cjs
          python tests/forms-browser.py
          python tests/forms-responsive.py
      - name: Verify published production forms
        if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
        run: |
          python scripts/wait-form-deployment.py
          FORM_TEST_BASE=https://interpiad.com FORM_TEST_OUT=/tmp/interpiad-forms-qa/production python tests/forms-documents.py
      - name: Save screenshots and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-form-browser-pdf-evidence
          path: /tmp/interpiad-forms-qa/
          if-no-files-found: warn
