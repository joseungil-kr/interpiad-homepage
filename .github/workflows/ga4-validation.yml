name: Validate GA4 public-page installation
on:
  push:
    branches: [ga4-install-20261113]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - run: hugo --destination /tmp/ga-off
      - run: HUGO_PARAMS_GA4ID=G-8GRC26GF2B hugo --destination /tmp/ga-on
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          off=Path('/tmp/ga-off'); on=Path('/tmp/ga-on')
          assert not any('data-ga4-id=' in p.read_text() for p in off.rglob('*.html'))
          assert (on/'index.html').read_text().count('data-ga4-id="G-8GRC26GF2B"')==1
          for p in (on/'tools').rglob('*.html'):
            assert 'data-ga4-id=' not in p.read_text(),str(p)
          assert 'data-ga4-id=' not in (on/'pdf-compress/index.html').read_text()
          for f in off.rglob('*'):
            if f.is_file():
              t=on/f.relative_to(off)
              assert t.exists()
              if f.suffix!='.html': assert f.read_bytes()==t.read_bytes(),str(f)
          print('PASS public-home one ID, tools/PDF excluded, non-HTML assets preserved')
          PY
      - run: node --check static/js/ga4-init.js
