name: PDF compressor browser smoke

on:
  push:
    branches: [master, 'feat/interpiad-pdf-compress-*']
    paths:
      - 'content/pdf-compress.md'
      - 'layouts/pdfcompress/**'
      - 'layouts/tools/list.html'
      - 'static/tools/pdf-compress/**'
      - 'static/tools/tools-index.css'
      - 'tests/pdf-compress-browser.py'
      - '.github/workflows/pdf-compress-check.yml'
  workflow_dispatch:

jobs:
  pdf-compress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Hugo and validate JavaScript
        run: |
          node --check static/tools/pdf-compress/app.js
          hugo --minify
          test -s public/tools/pdf-compress/index.html
          test -s public/tools/pdf-compress/vendor/pdf-lib.min.js
          grep -q 'tools/pdf-compress' public/sitemap.xml
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0 pypdf==6.1.3
          python -m playwright install --with-deps chromium
      - name: Browser compression test
        run: |
          python -m http.server 8765 --directory public >/tmp/pdf-compress-server.log 2>&1 &
          for attempt in $(seq 1 15); do curl -fsS http://127.0.0.1:8765/tools/pdf-compress/ >/dev/null && break; sleep 1; done
          python tests/pdf-compress-browser.py
      - name: Archive visual and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-compress-qa
          path: /tmp/interpiad-pdf-compress-test/
          if-no-files-found: warn
