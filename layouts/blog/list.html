{{ define "main" }}
<section class="services-hero">
  <div class="wrap section-head">
    <p class="eyebrow">{{ .Params.eyebrow | default .Title }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.intro }}<p class="section-head__sub">{{ . }}</p>{{ end }}
  </div>
</section>

<section class="services-list">
  <div class="wrap">
    <ul class="blog-grid">
      {{ range $i, $p := .Pages.ByWeight }}
      {{ partial "blog-card.html" (dict "page" $p "delay" (printf "%.2fs" (mul (mod $i 3) 0.08))) }}
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
