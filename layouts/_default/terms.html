{{ define "main" }}
<section class="services-hero">
  <div class="wrap section-head">
    <p class="eyebrow">{{ .Title }}</p>
    <h1>{{ .Title }}</h1>
  </div>
</section>

<section class="services-list">
  <div class="wrap">
    {{ $terms := .Data.Terms.Alphabetical }}
    {{ if $terms }}
    <ul class="tag-list">
      {{ range $terms }}
      <li><a class="tag-badge tag-badge--link" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a></li>
      {{ end }}
    </ul>
    {{ else }}
    <p class="section-head__sub">아직 등록된 항목이 없습니다.</p>
    {{ end }}
  </div>
</section>
{{ end }}
