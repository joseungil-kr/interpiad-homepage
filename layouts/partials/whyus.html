<section class="whyus" id="whyus">
  <div class="wrap">
    <div class="section-head reveal">
      <p class="eyebrow">{{ .Params.whyus.eyebrow }}</p>
      <h2>{{ .Params.whyus.title }}</h2>
    </div>

    <ul class="whyus-grid">
      {{ range $i, $w := hugo.Data.whyus }}
      <li class="whyus-card reveal" style="--reveal-delay: {{ printf "%.2f" (mul $i 0.08) }}s">
        <h3 class="whyus-card__title">{{ $w.title }}</h3>
        <p class="whyus-card__desc">{{ $w.desc }}</p>
      </li>
      {{ end }}
    </ul>
  </div>
</section>
