<section class="process" id="process">
  <div class="wrap">
    <div class="section-head section-head--light">
      <p class="eyebrow eyebrow--light">{{ .Params.process.eyebrow }}</p>
      <h2>{{ .Params.process.title }}</h2>
    </div>

    <ol class="process-list">
      {{ range hugo.Data.process }}
      <li class="process-item">
        <span class="process-item__num">{{ .num }}</span>
        <h3 class="process-item__title">{{ .title }}</h3>
        <p class="process-item__desc">{{ .desc }}</p>
      </li>
      {{ end }}
    </ol>
  </div>
</section>
