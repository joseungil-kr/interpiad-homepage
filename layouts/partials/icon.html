{{- $name := . -}}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <circle cx="10" cy="10" r="6"></circle>
    <line x1="14.5" y1="14.5" x2="20" y2="20"></line>
    <polyline points="7.5 11 10 7.5 12.5 11"></polyline>
  {{- else if eq $name "blog-grow" }}
    <path d="M12 20V12"></path>
    <path d="M12 12C12 8 8 8 6 6C6 10 8 12 12 12"></path>
    <path d="M12 12C12 9 15 9 17 7C17 10.5 15 12 12 12"></path>
  {{- else if eq $name "blog-post" }}
    <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"></path>
    <line x1="13.5" y1="6.5" x2="17.5" y2="10.5"></line>
  {{- else if eq $name "web-doc" }}
    <circle cx="12" cy="12" r="8"></circle>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <path d="M12 4c3 4 3 12 0 16"></path>
    <path d="M12 4c-3 4-3 12 0 16"></path>

    <line x1="8" y1="9" x2="16" y2="9"></line>
    <line x1="8" y1="12" x2="13" y2="12"></line>
  {{- else if eq $name "place-manage" }}
    <path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"></path>
    <circle cx="12" cy="9" r="2.5"></circle>
  {{- else if eq $name "place-rank" }}
    <line x1="4" y1="20" x2="20" y2="20"></line>
    <rect x="6" y="14" width="3" height="6"></rect>
    <rect x="11" y="10" width="3" height="10"></rect>
    <rect x="16" y="5" width="3" height="15"></rect>
  {{- else if eq $name "web-build" }}
    <rect x="3" y="4" width="18" height="16" rx="1.5"></rect>
    <line x1="3" y1="8" x2="21" y2="8"></line>
    <polyline points="8 12 6 14.5 8 17"></polyline>
    <polyline points="14 12 16 14.5 14 17"></polyline>

</svg>
