<header class="site-header" id="site-header">
  <div class="wrap site-header__inner">
    <a class="site-logo" href="#main">
      <img class="site-logo__img" src="{{ "images/logo/logo.png" | relURL }}" alt="인터피아드" width="500" height="127">
    </a>

    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">메뉴 열기</span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

    <nav class="site-nav" id="site-nav">
      <ul>
        <li><a href="{{ "/" | relURL }}#about">회사소개</a></li>
        <li>
          <details class="nav-dropdown">
            <summary>서비스</summary>
            <ul class="nav-dropdown__menu">
              <li><a href="{{ "services/" | relURL }}">서비스 전체 보기</a></li>
              {{ range (where site.RegularPages "Section" "services").ByWeight }}
              <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
              {{ end }}
            </ul>
          </details>
        </li>
        <li><a href="{{ "blog/" | relURL }}">블로그</a></li>
        <li><a href="{{ "/" | relURL }}#whyus">강점</a></li>
        <li><a href="{{ "/" | relURL }}#contact">문의하기</a></li>
      </ul>
      <a class="btn btn--brass site-nav__cta" href="{{ "/" | relURL }}#contact">상담 문의</a>
    </nav>
  </div>
</header>
