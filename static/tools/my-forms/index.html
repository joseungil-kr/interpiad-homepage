<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>내 서식 관리 | 인터피아드</title><link rel="stylesheet" href="/tools/my-forms/style.css"><script type="module" src="/tools/my-forms/manager.js"></script><link rel="stylesheet" href="/tools/my-forms/ongi-login.css"></head><body class="ongi-portal"><main><a href="/tools/">무료 업무서식</a><h1>내 서식 관리</h1><p>작성·인쇄·PDF 저장은 로그인 없이 이용할 수 있습니다. 개인 발행본과 거래처를 보관할 때 로그인해 주세요.</p><section id="login" class="ongi-login-page"><h2>로그인</h2><div class="ongi-login-providers"><a class="provider-naver" href="/auth/naver"><span aria-hidden="true">N</span>네이버 로그인</a><a class="provider-kakao" href="/auth/kakao">카카오톡 로그인</a><a class="provider-google" href="/auth/google"><span aria-hidden="true">G</span>구글 로그인</a></div><p>로그인 수단마다 별도 계정으로 관리합니다.</p></section><p id="status" role="status"></p><section id="workspace" hidden><nav><button id="documents">발행서식</button><button id="customers">거래처</button><button id="add">거래처 등록</button><button id="logout">로그아웃</button></nav><form id="search"><label>종류<select name="kind"><option value="">전체</option><option value="manual-invoice">거래명세표 가로</option><option value="manual-invoice-vertical">거래명세표 세로</option><option value="simple-receipt">간이영수증</option><option value="quotation">견적서</option><option value="employment-contract">근로계약서</option></select></label><label>거래처명<input name="customer"></label><label>거래처 검색<input name="name"></label><label>발행일<input type="date" name="date"></label><label>번호<input name="number"></label><label>휴지통<select name="trash"><option value="0">보관 중</option><option value="1">휴지통</option></select></label><button>검색</button></form><form id="customer-editor" hidden><h2>거래처 정보</h2><label>거래처명<input name="name" required maxlength="120"></label><label>주소<input name="address" maxlength="200"></label><label>연락처<input name="phone" maxlength="200"></label><label>사업자등록번호<input name="registration" maxlength="200"></label><button>거래처 저장</button></form><div id="results"></div><section id="viewer" hidden><h2>발행 당시 원본</h2><button id="reprint">재출력 / PDF 저장</button><button id="close-viewer">닫기</button><iframe title="보존된 발행본" sandbox="allow-same-origin allow-modals"></iframe></section></section></main></body></html>
